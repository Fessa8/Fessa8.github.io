<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fessa — games</title>
<meta name="description" content="Small games by the independent developer Fessa.">
<style>
  :root { --bg: #1B1420; --panel: #241A28; --text: #E8D9B5; --dim: #A8977A; --brass: #C9A05A; --candle: #F2B134; --line: #3A2B40; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { color: var(--candle); font-size: 34px; margin: 0; }
  .meta { color: var(--dim); margin: 4px 0 32px; }
  .game { display: flex; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .game img { width: 72px; height: 72px; border-radius: 16px; image-rendering: pixelated; flex: none; }
  .game h2 { color: var(--brass); font-size: 20px; margin: 0 0 4px; }
  .game p { margin: 0 0 6px; }
  a { color: var(--candle); }
  footer { color: var(--dim); margin-top: 40px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Fessa</h1>
  <div class="meta">Small games by an independent developer</div>

  <div class="game">
    <img src="codebreaker/icon.png" alt="Code Breaker icon">
    <div>
      <h2>Code Breaker</h2>
      <p>Crack the mansion's locks: find the secret code of symbols with star and key clues.</p>
      <p><a href="codebreaker/privacy.html">Privacy policy · Политика конфиденциальности</a></p>
    </div>
  </div>

  <footer>Contact: <a href="mailto:fessa.gamedev@gmail.com">fessa.gamedev@gmail.com</a></footer>
</main>
</body>
</html>
